<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cart</title>
  <link rel="stylesheet" href="product.css">
</head>
<body>
  <main class="page">
    <a href="product.html" class="back-btn">← Back</a>

    <h1>Cart</h1>

    <div id="cartEmpty" style="display:none;">Cart is empty.</div>

    <div id="cartList"></div>

    <div class="cart-summary">
      <div>Total: <strong id="cartTotal">0.00 €</strong></div>
      <button class="btn primary" id="checkoutBtn" type="button">Proceed to Buy</button>
      <button class="btn secondary" id="clearBtn" type="button">Clear cart</button>
    </div>
  </main>

  <script src="cart-lib.js"></script>
  <script src="cart-page.js"></script>
</body>
</html>
